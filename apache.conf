# Camview Apache protection. install.sh substitutes __DIR__ with the
# install path, writes this to /etc/apache2/conf-available/camview.conf
# and runs a2enconf. It works regardless of AllowOverride, unlike the
# .htaccess files (which are ignored when AllowOverride is None).

<Directory "__DIR__">
    # these files contain camera credentials / password hashes
    <Files ~ "^(streams|users|settings)\.json$|^mediamtx\.yml$">
        Require all denied
    </Files>
    # never serve VCS metadata from cloned deployments
    RedirectMatch 404 /\.git
</Directory>

# recordings and snapshots are served through the authenticated API only
<DirectoryMatch "^__DIR__/(motion|snapshots)">
    Require all denied
</DirectoryMatch>
