<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; color: #ddd;
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }

  #bar { height: 36px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; background: #1b1b1b; border-bottom: 1px solid #2a2a2a;
    position: relative; }
  #bar h1 { font-size: 14px; font-weight: 600; }
  .brand img { height: 24px; display: block; }
  #bar a { color: #8ab4ff; text-decoration: none; font-size: 13px; }
  #bar .hint { margin-left: auto; color: #888; font-size: 12px; }
  #burger { display: none; margin-left: auto; background: none; border: 1px solid #333;
    border-radius: 4px; color: #ddd; font-size: 18px; line-height: 1;
    padding: 3px 10px; cursor: pointer; }
  #menu { display: contents; }

  /* mobile: hamburger menu + cameras stacked in a scrollable column */

  #stage { height: calc(100% - 36px); display: flex;
    align-items: center; justify-content: center; }
  #grid { display: grid; gap: 4px; }

  .tile { position: relative; background: #000; overflow: hidden;
    border: 1px solid #2a2a2a; border-radius: 4px; cursor: pointer; }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile:fullscreen { border: none; border-radius: 0; cursor: default; }

  .tile .label { position: absolute; left: 0; bottom: 0; padding: 2px 8px;
    background: rgba(0,0,0,.55); font-size: 12px; border-radius: 0 4px 0 0;
    pointer-events: none; }
  .tile .dot { position: absolute; left: 8px; top: 8px; width: 10px; height: 10px;
    border-radius: 50%; background: #777; pointer-events: none; }
  .tile .dot.online { background: #4caf50; }
  .tile .status { position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; color: #999;
    background: rgba(0,0,0,.35); font-size: 13px; pointer-events: none; }
  .tile .status[hidden] { display: none; }

  .tile .btn { position: absolute; width: 28px; height: 28px; border: none;
    border-radius: 4px; cursor: pointer; background: rgba(0,0,0,.55);
    color: #ddd; font-size: 14px; }
  .tile .btn:hover { background: rgba(60,60,60,.8); }
  .tile .mute { right: 6px; bottom: 6px; }
  .tile .snap { right: 40px; bottom: 6px; }
  .tile .bell { right: 74px; bottom: 6px; }
  .tile .bell.on { background: #2d6cdf; color: #fff; }
  .tile .bell.noaudio { background: #b26a00; color: #fff;
    animation: bellpulse 1.4s infinite; }
  @keyframes bellpulse { 50% { opacity: .45; } }
  .tile.alarmed { outline: 4px solid #f52313; outline-offset: -4px;
    box-shadow: 0 0 18px rgba(245,35,19,.8); }

  .tile .toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    padding: 4px 12px; background: rgba(20,80,30,.9); border-radius: 4px;
    font-size: 12px; pointer-events: none; white-space: nowrap; }
  .tile .toast.err { background: rgba(100,25,25,.9); }

  #linkdown { position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
    background: #662222; color: #fff; padding: 6px 16px; border-radius: 4px;
    font-size: 13px; z-index: 60; box-shadow: 0 2px 10px rgba(0,0,0,.5); }

  #empty { color: #888; }

  @media (max-width: 700px) {
    html, body { overflow: auto; height: auto; }
    #bar .hint { display: none; }
    #burger { display: block; }
    #menu { display: none; position: absolute; top: 36px; left: 0; right: 0; z-index: 40;
      background: #1b1b1b; border-bottom: 1px solid #2a2a2a; padding: 12px 16px;
      flex-direction: column; gap: 16px; font-size: 15px; }
    #menu.open { display: flex; }
    #stage { display: block; height: auto; padding: 4px; }
    #grid { display: block; }
    .tile { width: 100%; aspect-ratio: 16/9; margin-bottom: 4px; }
  }
</style>
</head>
<body>
  <div id="bar">
    <a class="brand" href="https://xaxero.com" target="_blank" rel="noopener"><img src="https://xaxero.com/images/XaxeroLogoSansSloganCopy.png" alt="Xaxero"></a>
    <h1>Camview</h1>
    <span id="count"></span>
    <button id="burger" aria-label="Menu">☰</button>
    <nav id="menu">
      <a href="motion.html">Motion</a>
      <a href="snapshots.html">Snapshots</a>
      <a href="admin.html" id="admin-link" hidden>⚙ Cameras</a>
      <a href="system.html" id="system-link" hidden>System</a>
      <a href="#" id="logout">Log out</a>
    </nav>
    <span class="hint">click = fullscreen &nbsp;·&nbsp; double-click = back to grid</span>
  </div>
  <div id="stage">
    <div id="grid"></div>
  </div>
  <div id="linkdown" hidden>connection lost — will resume automatically…</div>

<script>
'use strict';

const grid  = document.getElementById('grid');
const count = document.getElementById('count');
const peers = new Map();   // name -> RTCPeerConnection
let CSRF = '';

// ---------- layout ----------

// Pick the column count that maximizes tile area, assuming 16:9 tiles
// that must all fit in the viewport without scrolling.
function bestLayout(n, W, H) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    let w = W / cols, h = w * 9 / 16;
    if (h * rows > H) { h = H / rows; w = h * 16 / 9; }
    if (!best || w * h > best.w * best.h) best = { cols, w, h };
  }
  return best;
}

function layout() {
  const tiles = grid.children;
  if (!tiles.length) return;
  if (window.innerWidth <= 700) {  // mobile: stacked, CSS-sized, scrollable
    grid.style.gridTemplateColumns = '';
    grid.style.gridAutoRows = '';
    return;
  }
  const stage = document.getElementById('stage');
  const W = stage.clientWidth - 8, H = stage.clientHeight - 8;
  const { cols, w, h } = bestLayout(tiles.length, W, H);
  const gap = 4;
  grid.style.gridTemplateColumns = `repeat(${cols}, ${Math.floor(w - gap)}px)`;
  grid.style.gridAutoRows = `${Math.floor(h - gap)}px`;
}

window.addEventListener('resize', layout);

const burger = document.getElementById('burger');
burger.addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
document.getElementById('menu').addEventListener('click', e => {
  if (e.target.tagName === 'A') document.getElementById('menu').classList.remove('open');
});

// ---------- WebRTC (WHEP) ----------

function waitForIce(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(resolve => {
    const done = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', done);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, 2000); // never hang the handshake
  });
}

async function connect(name, video) {
  const pc = new RTCPeerConnection();
  try {
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    let trackResolver = null;
    pc.ontrack = e => {
      video.srcObject = e.streams[0];
      if (trackResolver) { trackResolver(); trackResolver = null; }
    };

    await pc.setLocalDescription(await pc.createOffer());
    await waitForIce(pc);

    const url = `http://${location.hostname}:8889/${encodeURIComponent(name)}/whep`;
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 10000); // never wedge on a hung handshake
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
      signal: ctrl.signal,
    });
    clearTimeout(timeout);
    if (!res.ok) throw new Error(`WHEP ${res.status}`);
    await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    peers.set(name, pc);
    // a handshake that never delivers a track (lossy link, wedged session)
    // is dead even if ICE says otherwise — force a retry
    if (!video.srcObject) {
      await Promise.race([
        new Promise(res => { trackResolver = res; }),
        new Promise((_, rej) =>
          setTimeout(() => rej(new Error('no track within 10s')), 10000)),
      ]);
    }
    return pc;
  } catch (err) {
    pc.close();
    throw err;
  }
}

// Wait until a peer connection dies (failed, or closed by the stall watchdog).
// Polls as well as listening: the connectionstatechange event is not always
// delivered (throttled/backgrounded pages), and a missed event would wedge
// the tile's reconnect loop until a page reload.
function untilDead(pc) {
  return new Promise(resolve => {
    const t = setInterval(() => {
      if (['failed', 'closed'].includes(pc.connectionState)) {
        clearInterval(t);
        resolve();
      }
    }, 2000);
    if (pc.connectionState === 'closed') { clearInterval(t); return resolve(); }
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed'].includes(pc.connectionState)) {
        clearInterval(t);
        resolve();
      }
    };
  });
}

// Per-tile lifecycle controller: lets the page suspend all streaming when
// hidden (mobile browsers freeze timers, so dead connections were only
// noticed on reload) and resume cleanly on return.
const streamCtls = new Map();  // name -> {active, video, status, stop, wake}

function stopStream(name) {
  const ctl = streamCtls.get(name);
  if (!ctl) return;
  ctl.active = false;
  ctl.gen = (ctl.gen || 0) + 1;  // any loop still running from before must exit
  if (ctl.wake) ctl.wake();
  const pc = peers.get(name);
  if (pc) { try { pc.close(); } catch {} }
  peers.delete(name);
  ctl.video.srcObject = null;
}

async function runStream(name, ctl) {
  const { video, status } = ctl;
  const myGen = ctl.gen || 0;
  // a stale loop (suspended mid-sleep, then resumed) must never touch shared
  // state again — otherwise two loops fight over peers and the tile wedges
  const alive = () => ctl.active && (ctl.gen || 0) === myGen;
  ctl.attempt = 0;

  // stall watchdog: if the picture stops advancing, the connection is
  // effectively dead even if ICE still looks fine — force a reconnect.
  let lastTime = -1, lastProgress = Date.now();
  const watchdog = setInterval(() => {
    if (!alive()) { clearInterval(watchdog); return; }
    const pc = peers.get(name);
    if (!pc) return;
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      lastProgress = Date.now();
    } else if (!video.paused && video.readyState >= 2 && Date.now() - lastProgress > 8000) {
      console.warn(name, 'stream stalled, reconnecting');
      pc.close();
    } else if (['failed', 'disconnected'].includes(pc.iceConnectionState) &&
               Date.now() - lastProgress > 8000) {
      pc.close();
    }
  }, 2000);
  ctl.stop = () => { clearInterval(watchdog); stopStream(name); };

  for (;;) {
    if (!alive()) break;
    try {
      status.textContent = ctl.attempt ? 'reconnecting…' : 'connecting…';
      status.hidden = false;
      const pc = await connect(name, video);
      if (!alive()) { pc.close(); break; }  // suspended mid-handshake
      ctl.attempt = 0;
      lastTime = -1;
      lastProgress = Date.now();
      status.hidden = true;
      await untilDead(pc);
    } catch (err) {
      console.warn(new Date().toISOString(), name, err);
    }
    if (!alive()) break;
    const pc = peers.get(name);
    if (pc) { try { pc.close(); } catch {} }
    peers.delete(name);
    video.srcObject = null;
    ctl.attempt++;
    const wait = Math.min(15000, 2000 * ctl.attempt);
    status.textContent = `offline — retrying in ${Math.round(wait / 1000)}s…`;
    status.hidden = false;
    await new Promise(r => { ctl.wake = r; setTimeout(r, wait); });
  }
}

// ---------- link supervisor (lossy links, tunnels) ----------

// Ping the API on a timer. When the link comes back (ping succeeds after
// failures, or the browser fires 'online'), tear down every peer and let
// each tile reconnect from a clean handshake — this recovers wedge states
// the per-tile watchdog cannot recognize, without a page reload.
let linkDown = false;

function recoverAll(reason) {
  window.__rc = (window.__rc || 0) + 1;  // test/debug hook
  console.log(new Date().toISOString(), 'camview:', reason, '— restarting all streams');
  for (const [name, ctl] of streamCtls) {
    const pc = peers.get(name);
    if (pc) { try { pc.close(); } catch {} }
    peers.delete(name);
    ctl.attempt = 0;
    if (ctl.active && ctl.wake) ctl.wake();  // interrupt any backoff sleep
  }
}

async function pingLink() {
  try {
    const res = await fetch('api/me.php', { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    if (linkDown) recoverAll('link restored');
    linkDown = false;
    document.getElementById('linkdown').hidden = true;
  } catch {
    if (!linkDown) console.warn(new Date().toISOString(), 'camview: link lost');
    linkDown = true;
    document.getElementById('linkdown').hidden = false;
  }
}
setInterval(() => { if (document.visibilityState === 'visible') pingLink(); }, 8000);
window.addEventListener('online', () => { pingLink(); recoverAll('browser online'); });

// Stop all streaming while the page is hidden — no decode, no network, and
// the server stops pulling idle cameras — then reconnect on return.
let suspended = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    suspended = true;
    for (const name of streamCtls.keys()) {
      stopStream(name);
      const st = grid.querySelector(`.tile[data-name="${CSS.escape(name)}"] .status`);
      if (st) { st.textContent = 'paused'; st.hidden = false; }
    }
  } else if (suspended) {
    suspended = false;
    for (const [name, ctl] of streamCtls) {
      if (!ctl.active) { ctl.active = true; runStream(name, ctl); }
    }
    refreshDots();
    pingLink();  // re-evaluate the link immediately on return
    // mobile browsers suspend the AudioContext in the background — wake it
    // and re-light the amber bell if the unlock could not be refreshed
    if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    updateBellAudioState();
  }
});

// ---------- motion alarm (bell widget) ----------

let audioCtx = null;
let alarmAudio = null, chimeUrl = null;
let audioBlocked = true;   // assume blocked until a chime actually plays

// armed-but-silent is the failure mode browsers force on us (audio unlock
// expires in the background) — make it unmissable: the bell pulses amber
function updateBellAudioState() {
  for (const name of streamCtls.keys()) {
    const b = grid.querySelector(`.tile[data-name="${CSS.escape(name)}"] .bell`);
    if (b && bellOn(name)) b.classList.toggle('noaudio', audioBlocked);
  }
}

// any real tap refreshes the audio unlock (browsers require a gesture)
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
}, { passive: true });

async function chime() {
  window.__chimeCount = (window.__chimeCount || 0) + 1;  // test/debug hook
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.onstatechange = updateBellAudioState;
    if (audioCtx.state !== 'running') await audioCtx.resume();
    if (audioCtx.state === 'running') {
      const t0 = audioCtx.currentTime + 0.03;  // let the resume settle
      [880, 660].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = f;
        o.type = 'sine';
        g.gain.setValueAtTime(0.35, t0 + i * 0.22);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.22 + 0.28);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0 + i * 0.22);
        o.stop(t0 + i * 0.22 + 0.28);
      });
      audioBlocked = false;
      updateBellAudioState();
      return;
    }
  } catch { /* fall through to the <audio> element */ }
  try {
    alarmAudio = alarmAudio || new Audio(chimeWavUrl());
    alarmAudio.currentTime = 0;
    await alarmAudio.play();
    audioBlocked = false;
  } catch (e) {
    console.warn('chime blocked by browser', e);
    audioBlocked = true;  // the amber pulse tells the user a tap is needed
  }
  updateBellAudioState();
}

const bellOn = name => localStorage.getItem('camview_bell_' + name) === '1';
const lastSeen = {};    // cam -> newest motion event ts we've alarmed on
let alarmPrimed = false;  // first poll only records; never alarms on old events

async function pollMotion() {
  if (![...streamCtls.keys()].some(bellOn)) {
    alarmPrimed = false;
    grid.querySelectorAll('.tile.alarmed').forEach(t => t.classList.remove('alarmed'));
    return;
  }
  try {
    const j = await (await fetch('api/motion.php?latest=1', { cache: 'no-store' })).json();
    const latest = j.latest || {};
    const now = Date.now() / 1000;
    for (const name of streamCtls.keys()) {
      const tile = grid.querySelector(`.tile[data-name="${CSS.escape(name)}"]`);
      if (!tile) continue;
      if (!bellOn(name)) { tile.classList.remove('alarmed'); continue; }
      const ts = latest[name];
      const prev = lastSeen[name];
      lastSeen[name] = ts;
      if (ts && alarmPrimed && (prev === undefined || ts > prev)) chime();
      tile.classList.toggle('alarmed', !!ts && now - ts < 6);
    }
    alarmPrimed = true;
  } catch { /* keep last state */ }
}
setInterval(() => { if (document.visibilityState === 'visible') pollMotion(); }, 2000);

// ---------- UI ----------

function makeTile(stream) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.dataset.name = stream.name;

  const video = document.createElement('video');
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = stream.name;

  const dot = document.createElement('div');
  dot.className = 'dot';

  const status = document.createElement('div');
  status.className = 'status';

  const mute = document.createElement('button');
  mute.className = 'btn mute';
  mute.textContent = '🔇';
  mute.title = 'Toggle audio';
  mute.addEventListener('click', e => {
    e.stopPropagation();
    video.muted = !video.muted;
    mute.textContent = video.muted ? '🔇' : '🔊';
  });
  mute.addEventListener('dblclick', e => e.stopPropagation());

  const snap = document.createElement('button');
  snap.className = 'btn snap';
  snap.textContent = '📷';
  snap.title = 'Save snapshot on server';
  snap.addEventListener('click', async e => {
    e.stopPropagation();
    snap.textContent = '⏳';
    try {
      const res = await fetch('api/snapshot.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ name: stream.name }),
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'failed');
      toast(tile, `saved ${j.file}`);
    } catch (err) {
      toast(tile, err.message, true);
    }
    snap.textContent = '📷';
  });
  snap.addEventListener('dblclick', e => e.stopPropagation());

  const bell = document.createElement('button');
  bell.className = 'btn bell';
  bell.title = 'Motion alarm: chime + red frame on motion (tap once to enable sound)';
  if (!stream.motion) bell.hidden = true;
  const setBell = on => {
    bell.classList.toggle('on', on);
    bell.classList.remove('noaudio');  // re-evaluated by the next chime/update
    bell.textContent = on ? '🔔' : '🔕';
    localStorage.setItem('camview_bell_' + stream.name, on ? '1' : '0');
  };
  setBell(bellOn(stream.name));
  bell.addEventListener('click', e => {
    e.stopPropagation();
    const on = !bell.classList.contains('on');
    setBell(on);
    if (on) chime();  // audible confirmation + unlocks audio (user gesture)
  });
  bell.addEventListener('dblclick', e => e.stopPropagation());

  tile.append(video, label, dot, status, mute, snap, bell);

  // single click -> fullscreen, double click -> back to grid
  tile.addEventListener('click', () => {
    if (!document.fullscreenElement) tile.requestFullscreen().catch(() => {});
  });
  tile.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
  });

  grid.appendChild(tile);
  const ctl = { active: true, video, status, stop: null, wake: null };
  streamCtls.set(stream.name, ctl);
  runStream(stream.name, ctl);
}

function toast(tile, msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if (isErr) t.classList.add('err');
  tile.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// refresh status dots from the API (cameras come and go)
async function refreshDots() {
  try {
    const cams = await (await fetch('api/cameras.php', { cache: 'no-store' })).json();
    for (const c of cams) {
      const dot = grid.querySelector(`.tile[data-name="${CSS.escape(c.name)}"] .dot`);
      if (dot) dot.classList.toggle('online', c.status === 'online');
    }
  } catch { /* keep last known state */ }
}

async function init() {
  let me;
  try {
    me = await (await fetch('api/me.php', { cache: 'no-store' })).json();
  } catch {
    grid.outerHTML = '<p id="empty">API unreachable — is PHP running?</p>';
    return;
  }
  if (me.setup_needed) { location = 'setup.html'; return; }
  if (!me.user) { location = 'login.html'; return; }
  CSRF = me.csrf;
  if (me.user.role === 'admin') {
    document.getElementById('admin-link').hidden = false;
    document.getElementById('system-link').hidden = false;
  }

  document.getElementById('logout').addEventListener('click', async e => {
    e.preventDefault();
    await fetch('api/logout.php', { method: 'POST' });
    location = 'login.html';
  });

  const camsRes = await fetch('api/cameras.php', { cache: 'no-store' });
  if (!camsRes.ok) {
    const j = await camsRes.json().catch(() => ({}));
    grid.outerHTML = '<p id="empty"></p>';
    document.getElementById('empty').textContent = j.error || `API error ${camsRes.status}`;
    return;
  }
  const streams = await camsRes.json();
  if (!streams.length) {
    grid.outerHTML = '<p id="empty">No cameras configured yet</p>';
    return;
  }
  count.textContent = `${streams.length} camera${streams.length > 1 ? 's' : ''}`;
  streams.forEach(makeTile);
  layout();
  // if bells are armed from a previous visit, audio starts blocked until
  // the first tap — show the amber bell immediately so it can't be missed
  if (streams.some(s => bellOn(s.name))) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.onstatechange = updateBellAudioState;
    } catch {}
    updateBellAudioState();
  }
  refreshDots();
  // skip polling while hidden — the page resumes it via visibilitychange
  setInterval(() => { if (document.visibilityState === 'visible') refreshDots(); }, 15000);
}

window.addEventListener('beforeunload', () => peers.forEach(pc => pc.close()));

init();
</script>
</body>
</html>
