<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Camview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #aaa; font: 14px system-ui, sans-serif; }
  #grid { display: grid; gap: 2px; align-content: center; justify-content: center;
    width: 100vw; min-height: 100vh; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #empty { grid-column: 1/-1; padding: 20px; text-align: center; }
</style>
</head>
<body>
  <div id="grid"></div>
<script>
'use strict';

const grid = document.getElementById('grid');

function bestLayout(n, W, H) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    let w = W / cols, h = w * 9 / 16;
    if (h * rows > H) { h = H / rows; w = h * 16 / 9; }
    if (!best || w * h > best.w * best.h) best = { cols, rows, w, h };
  }
  return best;
}

function layout() {
  const n = grid.querySelectorAll('video').length;
  if (!n) return;
  const { cols, w, h } = bestLayout(n, window.innerWidth - 2, window.innerHeight - 2);
  grid.style.gridTemplateColumns = `repeat(${cols}, ${Math.floor(w - 2)}px)`;
  grid.style.gridAutoRows = `${Math.floor(h - 2)}px`;
}
window.addEventListener('resize', layout);

function waitForIce(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(resolve => {
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') resolve();
    });
    setTimeout(resolve, 2000);
  });
}

function watch(name) {
  const video = document.createElement('video');
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.title = name;
  grid.appendChild(video);
  let pc = null;
  let retry = null;

  async function connect() {
    clearTimeout(retry);
    if (pc) pc.close();
    pc = new RTCPeerConnection();
    const current = pc;
    try {
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.ontrack = e => { video.srcObject = e.streams[0]; };
      pc.onconnectionstatechange = () => {
        if (pc === current && ['failed', 'disconnected'].includes(pc.connectionState)) {
          retry = setTimeout(connect, 3000);
        }
      };
      await pc.setLocalDescription(await pc.createOffer());
      await waitForIce(pc);
      const res = await fetch(`http://${location.hostname}:8889/${encodeURIComponent(name)}/whep`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!res.ok) throw new Error(`WHEP ${res.status}`);
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    } catch {
      current.close();
      retry = setTimeout(connect, 3000);
    }
  }
  connect();
}

async function init() {
  const res = await fetch('api/free.php', { cache: 'no-store' });
  const cameras = await res.json();
  if (!res.ok) {
    grid.innerHTML = '<p id="empty">Public mosaic is not enabled</p>';
    return;
  }
  if (!cameras.length) {
    grid.innerHTML = '<p id="empty">No cameras configured</p>';
    return;
  }
  cameras.forEach(camera => watch(camera.name));
  layout();
}
init().catch(() => {
  grid.innerHTML = '<p id="empty">Camera service unavailable</p>';
});
</script>
</body>
</html>
