<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camview — motion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #bar { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #1b1b1b; border-bottom: 1px solid #2a2a2a; }
  #bar h1 { font-size: 15px; }
  #bar a { color: #8ab4ff; text-decoration: none; }
  #bar .spacer { margin-left: auto; }
  main { padding: 16px; max-width: 1300px; margin: 0 auto; }
  #controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  #controls button { padding: 5px 14px; border: 1px solid #333; border-radius: 4px;
    cursor: pointer; background: #1b1b1b; color: #ccc; }
  #controls button.active { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
  #controls .note { color: #777; font-size: 12px; margin-left: 8px; }
  .lane { display: flex; align-items: center; margin-bottom: 4px; }
  .lane .name { width: 180px; flex: none; font-size: 13px; color: #bbb;
    display: flex; align-items: center; gap: 8px; }
  .lane .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane .camthumb { width: 52px; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 3px; background: #000; border: 1px solid #262626; flex: none; }
  .lane canvas { flex: 1; height: 42px; background: #161616; border: 1px solid #262626;
    border-radius: 3px; cursor: crosshair; }
  #axis { display: flex; margin-left: 180px; color: #666; font-size: 11px;
    justify-content: space-between; padding: 2px 4px; }
  #thumb { position: fixed; display: none; z-index: 10; width: 260px; padding: 4px;
    background: #000; border: 1px solid #2d6cdf; border-radius: 4px;
    pointer-events: none; }
  #thumb img { width: 100%; display: block; }
  #thumb .cap { font-size: 11px; color: #8ab4ff; padding: 2px; }
  #empty { color: #888; }
  #err { color: #ff6b6b; min-height: 18px; margin-top: 8px; }

  /* frame modal */
  #modal-bg { position: fixed; inset: 0; display: none; z-index: 20;
    background: rgba(0,0,0,.75); align-items: center; justify-content: center; }
  #modal-bg.open { display: flex; }
  #fmodal { position: relative; max-width: 90vw; background: #161616;
    border: 1px solid #333; border-radius: 8px; padding: 12px; }
  #fmodal img { display: block; max-width: 86vw; max-height: 76vh;
    background: #000; margin: 0 auto; }
  #fmodal .cap { display: flex; align-items: center; gap: 12px; margin-top: 10px;
    font-size: 13px; color: #aaa; }
  #fmodal .cap b { color: #ddd; }
  #fmodal .nav { position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 64px; border: none; border-radius: 6px; cursor: pointer;
    background: rgba(40,40,40,.85); color: #fff; font-size: 26px; line-height: 1; }
  #fmodal .nav:hover { background: #2d6cdf; }
  #fmodal .nav:disabled { opacity: .3; cursor: default; background: rgba(40,40,40,.85); }
  #fmodal #prev { left: 20px; }
  #fmodal #next { right: 20px; }
  #fmodal .ctl { padding: 5px 12px; border: 1px solid #333; border-radius: 4px;
    cursor: pointer; background: #1b1b1b; color: #ccc; font-size: 13px; }
  #fmodal .ctl:hover { border-color: #2d6cdf; }
  #fmodal #close { position: absolute; top: 8px; right: 10px; border: none;
    background: none; color: #888; font-size: 22px; cursor: pointer; }
  #fmodal #close:hover { color: #fff; }
</style>
</head>
<body>
  <div id="bar">
    <h1>Camview — motion</h1>
    <a href="index.html">Viewer</a>
    <a href="snapshots.html">Snapshots</a>
    <a href="admin.html" class="admin-only" hidden>Cameras</a>
    <a href="users.html" class="admin-only" hidden>Users</a>
    <span class="spacer"></span>
    <span id="who"></span>
    <a href="#" id="logout">Log out</a>
  </div>
  <main>
    <div id="controls">
      <button data-range="24h" class="active">Past 24 hours</button>
      <button data-range="7d">Past 7 days</button>
      <span class="note" id="note"></span>
      <span class="note">scroll on a lane to zoom · double-click to reset</span>
    </div>
    <div id="axis"></div>
    <div id="lanes"></div>
    <p id="empty" hidden>No motion-enabled cameras (enable Motion detection on the Cameras page).</p>
    <div id="err"></div>
  </main>
  <div id="thumb"><img alt=""><div class="cap"></div></div>

  <div id="modal-bg">
    <div id="fmodal">
      <button id="close" title="Close (Esc)">×</button>
      <img id="fimg" alt="">
      <button class="nav" id="prev" title="Previous frame (←)">‹</button>
      <button class="nav" id="next" title="Next frame (→)">›</button>
      <div class="cap">
        <button class="ctl" id="play" title="Timelapse (space)">▶ Timelapse</button>
        <b id="fcam"></b><span id="ftime"></span>
        <span class="spacer" style="margin-left:auto" id="fpos"></span>
      </div>
    </div>
  </div>

<script>
'use strict';
let CSRF = '';
let range = '24h';
let data = null;          // api response
let buckets = {};         // cam -> Map(col -> {count, files: []})
let COLS = 1440;
const FULL = () => range === '24h'
  ? { span: 86400, cols: 1440 }
  : { span: 7 * 86400, cols: 168 };
let VIEW = { start: 0, span: 0 };   // current zoom window (epoch seconds)

async function api(path) {
  const res = await fetch('api/' + path, { cache: 'no-store' });
  if (res.status === 401) { location = 'login.html'; throw new Error('auth'); }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ---------- timeline ----------

function buildBuckets() {
  buckets = {};
  const perCol = VIEW.span / COLS;
  for (const cam of data.cams) {
    const m = new Map();
    for (const [ts, rel] of data.files[cam] || []) {
      const col = Math.floor((ts - VIEW.start) / perCol);
      if (col < 0 || col >= COLS) continue;
      const b = m.get(col) || { count: 0, files: [] };
      b.count++;
      b.files.push(rel);
      m.set(col, b);
    }
    buckets[cam] = m;
  }
}

function draw() {
  const lanes = document.getElementById('lanes');
  lanes.innerHTML = '';
  for (const cam of data.cams) {
    const row = document.createElement('div');
    row.className = 'lane';
    row.innerHTML = '<div class="name"><img class="camthumb" alt=""><span></span></div><canvas></canvas>';
    row.querySelector('.name span').textContent = cam;
    const camFiles = data.files[cam] || [];
    const thumbImg = row.querySelector('.camthumb');
    if (camFiles.length) {
      thumbImg.src = 'api/motion.php?file=' + encodeURIComponent(camFiles[camFiles.length - 1][1]);
      thumbImg.title = 'latest motion frame';
    } else {
      thumbImg.style.visibility = 'hidden';
    }
    lanes.appendChild(row);
    const cv = row.querySelector('canvas');
    cv.width = cv.clientWidth;
    cv.height = cv.clientHeight;
    const ctx = cv.getContext('2d');
    const m = buckets[cam];
    let max = 1;
    m.forEach(b => { max = Math.max(max, b.count); });
    m.forEach((b, col) => {
      const a = 0.25 + 0.75 * (b.count / max);
      ctx.fillStyle = `rgba(76,175,80,${a})`;
      ctx.fillRect(col / COLS * cv.width, 0, Math.max(1, cv.width / COLS), cv.height);
    });
    cv.dataset.cam = cam;
    cv.addEventListener('mousemove', onHover);
    cv.addEventListener('mouseleave', hideThumb);
    cv.addEventListener('click', ev => {
      const b = bucketAt(cv, ev);
      if (b) openModal(cam, b.files[0]);
    });
    cv.addEventListener('wheel', onZoom, { passive: false });
    cv.addEventListener('dblclick', resetZoom);
  }
  drawAxis();
}

function drawAxis() {
  const axis = document.getElementById('axis');
  axis.innerHTML = '';
  const marks = range === '24h' ? 8 : 7;
  for (let i = 0; i <= marks; i++) {
    const t = new Date((VIEW.start + VIEW.span * i / marks) * 1000);
    const s = document.createElement('span');
    if (range === '24h') {
      s.textContent = VIEW.span <= 3600
        ? t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        : t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } else {
      s.textContent = VIEW.span <= 86400 * 2
        ? t.toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : t.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
    }
    axis.appendChild(s);
  }
}

function bucketAt(cv, ev) {
  const r = cv.getBoundingClientRect();
  const col = Math.floor((ev.clientX - r.left) / r.width * COLS);
  return buckets[cv.dataset.cam]?.get(col);
}

function onZoom(ev) {
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect();
  const frac = (ev.clientX - r.left) / r.width;
  const anchor = VIEW.start + frac * VIEW.span;
  const factor = ev.deltaY < 0 ? 0.8 : 1.25;
  const full = FULL().span;
  let span = Math.min(full, Math.max(300, VIEW.span * factor));  // min 5 minutes
  const now = Math.floor(Date.now() / 1000);
  let start = anchor - frac * span;
  start = Math.max(now - full, Math.min(now - span, start));
  VIEW = { start, span };
  buildBuckets();
  draw();
}

function resetZoom() {
  VIEW = { start: Math.floor(Date.now() / 1000) - FULL().span, span: FULL().span };
  buildBuckets();
  draw();
}

function onHover(ev) {
  const b = bucketAt(ev.currentTarget, ev);
  const thumb = document.getElementById('thumb');
  if (!b) { hideThumb(); return; }
  const img = thumb.querySelector('img');
  const rel = b.files[0];
  if (!img.src.endsWith(rel)) img.src = 'api/motion.php?file=' + encodeURIComponent(rel);
  thumb.querySelector('.cap').textContent =
    `${ev.currentTarget.dataset.cam} · ${b.count} frame${b.count > 1 ? 's' : ''}`;
  thumb.style.display = 'block';
  thumb.style.left = Math.min(ev.clientX + 16, window.innerWidth - 280) + 'px';
  thumb.style.top = Math.min(ev.clientY + 16, window.innerHeight - 220) + 'px';
}

function hideThumb() { document.getElementById('thumb').style.display = 'none'; }

// ---------- frame modal ----------

const M = { cam: null, files: [], idx: 0, timer: null };

function openModal(cam, rel) {
  M.cam = cam;
  M.files = (data.files[cam] || []).map(f => f[1]);
  M.idx = Math.max(0, M.files.indexOf(rel));
  document.getElementById('modal-bg').classList.add('open');
  showFrame();
}

function closeModal() {
  stopTimelapse();
  document.getElementById('modal-bg').classList.remove('open');
}

function showFrame() {
  const img = document.getElementById('fimg');
  img.src = 'api/motion.php?file=' + encodeURIComponent(M.files[M.idx]);
  const ts = (data.files[M.cam] || [])[M.idx]?.[0];
  document.getElementById('fcam').textContent = M.cam;
  document.getElementById('ftime').textContent =
    ts ? new Date(ts * 1000).toLocaleString() : '';
  document.getElementById('fpos').textContent = `${M.idx + 1} / ${M.files.length}`;
  document.getElementById('prev').disabled = M.idx <= 0;
  document.getElementById('next').disabled = M.idx >= M.files.length - 1;
}

function step(d) {
  const i = M.idx + d;
  if (i < 0 || i >= M.files.length) return;
  M.idx = i;
  showFrame();
}

function startTimelapse() {
  if (M.idx >= M.files.length - 1) M.idx = -1;   // at the end -> replay from start
  M.timer = setInterval(() => {
    if (M.idx >= M.files.length - 1) { stopTimelapse(); return; }
    step(1);
  }, 1000);
  document.getElementById('play').textContent = '⏸ Pause';
}

function stopTimelapse() {
  clearInterval(M.timer);
  M.timer = null;
  document.getElementById('play').textContent = '▶ Timelapse';
}

document.getElementById('prev').addEventListener('click', () => { stopTimelapse(); step(-1); });
document.getElementById('next').addEventListener('click', () => { stopTimelapse(); step(1); });
document.getElementById('play').addEventListener('click', () => M.timer ? stopTimelapse() : startTimelapse());
document.getElementById('close').addEventListener('click', closeModal);
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal-bg').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') { stopTimelapse(); step(-1); }
  else if (e.key === 'ArrowRight') { stopTimelapse(); step(1); }
  else if (e.key === ' ') { e.preventDefault(); M.timer ? stopTimelapse() : startTimelapse(); }
});

// ---------- page ----------

async function refresh() {
  data = await api('motion.php?range=' + range);
  document.getElementById('empty').hidden = data.cams.length > 0;
  let total = 0;
  for (const cam of data.cams) total += (data.files[cam] || []).length;
  document.getElementById('note').textContent =
    `${data.cams.length} camera(s), ${total} motion frame${total === 1 ? '' : 's'} recorded`;
  COLS = FULL().cols;
  resetZoom();
}

document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    range = btn.dataset.range;
    refresh().catch(fail);
  });
});

document.getElementById('logout').addEventListener('click', async e => {
  e.preventDefault();
  await fetch('api/logout.php', { method: 'POST' });
  location = 'login.html';
});

const fail = e => { document.getElementById('err').textContent = e.message; };

(async () => {
  const me = await (await fetch('api/me.php')).json();
  if (me.setup_needed) { location = 'setup.html'; return; }
  if (!me.user) { location = 'login.html'; return; }
  CSRF = me.csrf;
  if (me.user.role === 'admin') {
    document.querySelectorAll('.admin-only').forEach(el => el.hidden = false);
  }
  document.getElementById('who').textContent = me.user.username;
  refresh().catch(fail);
  setInterval(() => { if (!document.getElementById('modal-bg').classList.contains('open')) refresh().catch(() => {}); }, 60000);
})();
</script>
</body>
</html>
