<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camview — users</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #bar { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #1b1b1b; border-bottom: 1px solid #2a2a2a; }
  #bar h1 { font-size: 15px; }
  #bar a { color: #8ab4ff; text-decoration: none; }
  #bar .spacer { margin-left: auto; }
  main { padding: 20px; max-width: 700px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262626; }
  th { color: #999; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  button { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer;
    background: #2d6cdf; color: #fff; }
  button.ghost { background: #2a2a2a; color: #ccc; }
  button.danger { background: #662222; }
  button:hover { filter: brightness(1.2); }
  input, select { padding: 7px; background: #111; border: 1px solid #333;
    border-radius: 4px; color: #ddd; }
  #add-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #add-form h2 { width: 100%; font-size: 14px; margin-bottom: 4px; }
  #err { color: #ff6b6b; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
  <div id="bar">
    <h1>Camview — users</h1>
    <a href="index.html">Viewer</a>
    <a href="admin.html">Cameras</a>
    <a href="snapshots.html">Snapshots</a>
    <span class="spacer"></span>
    <span id="who"></span>
    <a href="#" id="logout">Log out</a>
  </div>
  <main>
    <table>
      <thead><tr><th>Username</th><th>Role</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="add-form">
      <h2>Add user</h2>
      <input id="f-username" placeholder="Username">
      <input id="f-password" type="password" placeholder="Password (min 8 chars)">
      <select id="f-role">
        <option value="viewer">viewer</option>
        <option value="admin">admin</option>
      </select>
      <button id="add">Add</button>
    </div>
    <div id="err"></div>
  </main>

<script>
'use strict';
let CSRF = '';
let ME = '';

async function api(path, method = 'GET', data) {
  const res = await fetch('api/' + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
    body: data ? JSON.stringify(data) : undefined,
  });
  if (res.status === 401) { location = 'login.html'; throw new Error('auth'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

function fail(e) { document.getElementById('err').textContent = e.message; }

async function refresh() {
  const users = await api('users.php');
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  for (const u of users) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td></td>
      <td>
        <select data-act="role">
          <option value="viewer">viewer</option>
          <option value="admin">admin</option>
        </select>
      </td>
      <td>
        <button class="ghost" data-act="pw">Reset password</button>
        <button class="danger" data-act="del">Delete</button>
      </td>`;
    tr.cells[0].textContent = u.username + (u.username === ME ? ' (you)' : '');
    const sel = tr.querySelector('[data-act=role]');
    sel.value = u.role;
    sel.addEventListener('change', () =>
      api('users.php', 'PUT', { username: u.username, role: sel.value }).then(refresh, fail));
    tr.querySelector('[data-act=pw]').addEventListener('click', () => {
      const pw = prompt(`New password for ${u.username} (min 8 chars):`);
      if (pw) api('users.php', 'PUT', { username: u.username, password: pw }).catch(fail);
    });
    tr.querySelector('[data-act=del]').addEventListener('click', () => {
      if (confirm(`Delete user "${u.username}"?`))
        api('users.php', 'DELETE', { username: u.username }).then(refresh, fail);
    });
    rows.appendChild(tr);
  }
}

document.getElementById('add').addEventListener('click', () => {
  api('users.php', 'POST', {
    username: document.getElementById('f-username').value.trim(),
    password: document.getElementById('f-password').value,
    role: document.getElementById('f-role').value,
  }).then(() => {
    document.getElementById('f-username').value = '';
    document.getElementById('f-password').value = '';
    refresh();
  }, fail);
});

document.getElementById('logout').addEventListener('click', async e => {
  e.preventDefault();
  await api('logout.php', 'POST');
  location = 'login.html';
});

(async () => {
  const me = await api('me.php');
  if (me.setup_needed) { location = 'setup.html'; return; }
  if (me.user.role !== 'admin') { location = 'index.html'; return; }
  CSRF = me.csrf;
  ME = me.user.username;
  document.getElementById('who').textContent = ME;
  refresh();
})();
</script>
</body>
</html>
