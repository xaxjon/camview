<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camview — cameras</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #bar { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #1b1b1b; border-bottom: 1px solid #2a2a2a; position: relative; }
  #bar h1 { font-size: 15px; }
  #bar a { color: #8ab4ff; text-decoration: none; }
  #bar .spacer { margin-left: auto; }
  #burger { display: none; margin-left: auto; background: none; border: 1px solid #333;
    border-radius: 4px; color: #ddd; font-size: 18px; line-height: 1;
    padding: 3px 10px; cursor: pointer; }
  #menu { display: contents; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262626; }
  th { color: #999; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.src { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #999; font-family: monospace; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .dot.online { background: #4caf50; } .dot.standby { background: #777; }
  .dot.disabled { background: #444; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #333; color: #aaa; }
  button { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer;
    background: #2d6cdf; color: #fff; }
  button.ghost { background: #2a2a2a; color: #ccc; }
  button.danger { background: #662222; }
  button.zone-on { background: #c0392b; }
  button.zone-off { background: #2e7d32; }
  button:hover { filter: brightness(1.2); }
  .brand img { height: 26px; display: block; }

  #zone-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; }
  #zone-bg.open { display: flex; }
  #zone-modal { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 16px; }
  #zone-view { position: relative; display: inline-block; line-height: 0;
    user-select: none; cursor: crosshair; }
  /* stable placeholder while the frame loads, so the modal can't reflow
     mid-drag; removed on img load, after which the box shrink-wraps the img */
  #zone-view.pending { width: min(80vw, 900px); aspect-ratio: 16/9; background: #000;
    cursor: wait; }
  #zone-view.pending img { visibility: hidden; }
  #zone-view img { max-width: min(80vw, 900px); max-height: 70vh; display: block; }
  #zone-hint { color: #999; font-size: 12px; margin: 6px 0 10px; }
  #zone-hint.err { color: #ff6b6b; }
  #zone-rect { position: absolute; border: 2px dashed #ffd54f;
    background: rgba(255,213,79,.15); display: none; pointer-events: none; }
  #zone-modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  input[type=text], input[type=password] { padding: 7px; background: #111;
    border: 1px solid #333; border-radius: 4px; color: #ddd; width: 100%; }
  label.cb { display: flex; gap: 8px; align-items: center; margin: 8px 0; }

  #modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; }
  #modal-bg.open { display: flex; }
  #modal { width: 440px; background: #1b1b1b; border: 1px solid #333; border-radius: 8px;
    padding: 20px; }
  #modal h2 { font-size: 16px; margin-bottom: 14px; }
  #modal .row { margin-bottom: 10px; }
  #modal .row label { display: block; color: #999; font-size: 12px; margin-bottom: 4px; }
  #test-result { min-height: 20px; margin: 8px 0; font-size: 13px; }
  #test-result.ok { color: #4caf50; } #test-result.fail { color: #ff6b6b; }
  #modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #err { color: #ff6b6b; min-height: 18px; margin-top: 8px; }

  @media (max-width: 700px) {
    #burger { display: block; }
    #menu { display: none; position: absolute; top: 44px; left: 0; right: 0; z-index: 40;
      background: #1b1b1b; border-bottom: 1px solid #2a2a2a; padding: 12px 16px;
      flex-direction: column; gap: 16px; font-size: 15px; }
    #menu.open { display: flex; }
    #menu .spacer { display: none; }
    main { padding: 10px; overflow-x: auto; }
    #modal { width: min(440px, 94vw); }
    td.src { max-width: 120px; }
  }
</style>
</head>
<body>
  <div id="bar">
    <a class="brand" href="https://xaxero.com" target="_blank" rel="noopener"><img src="https://xaxero.com/images/XaxeroLogoSansSloganCopy.png" alt="Xaxero"></a>
    <h1>Camview — cameras</h1>
    <button id="burger" aria-label="Menu">☰</button>
    <nav id="menu">
      <a href="index.html">Viewer</a>
      <a href="motion.html">Motion</a>
      <a href="snapshots.html">Snapshots</a>
      <a href="users.html">Users</a>
      <a href="system.html">System</a>
      <span class="spacer"></span>
      <span id="who"></span>
      <a href="#" id="logout">Log out</a>
    </nav>
  </div>
  <main>
    <p style="margin-bottom:14px"><button id="add">+ Add camera</button></p>
    <table>
      <thead><tr>
        <th></th><th>Name</th><th>Source</th><th>Audio</th><th>Enabled</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="err"></div>
  </main>

  <div id="modal-bg">
    <div id="modal">
      <h2 id="modal-title">Add camera</h2>
      <div class="row"><label>Name (letters, digits, - and _)</label>
        <input type="text" id="f-name"></div>
      <div class="row"><label>RTSP source URL</label>
        <input type="text" id="f-source" placeholder="rtsp://user:pass@ip:554/..."></div>
      <label class="cb"><input type="checkbox" id="f-transcode"> Transcode audio
        <span class="badge">needed for AAC cameras</span></label>
      <label class="cb"><input type="checkbox" id="f-motion"> Motion detection
        <span class="badge">records JPEGs, see Motion page</span></label>
      <div class="row" id="motion-sens-row" style="display:none">
        <label>Sensitivity: <span id="f-sens-val">5</span> <span style="color:#777">(0 = least, 9 = most)</span></label>
        <input type="range" id="f-sens" min="0" max="9" step="1" value="5" style="width:100%">
      </div>
      <label class="cb"><input type="checkbox" id="f-enabled" checked> Enabled</label>
      <div id="test-result"></div>
      <div class="actions">
        <button class="ghost" id="test">Test connection</button>
        <button class="ghost" id="cancel">Cancel</button>
        <button id="save">Save</button>
      </div>
    </div>
  </div>

  <div id="zone-bg">
    <div id="zone-modal">
      <h2 id="zone-title">Motion zone</h2>
      <p id="zone-hint">Drag a rectangle on the frame — only motion inside it is recorded.</p>
      <div id="zone-view" class="pending">
        <img id="zone-img" alt="camera frame" draggable="false">
        <div id="zone-rect"></div>
      </div>
      <div class="actions">
        <button class="danger" id="zone-clear">Clear</button>
        <button class="ghost" id="zone-cancel">Cancel</button>
        <button id="zone-accept">Accept</button>
      </div>
    </div>
  </div>

<script>
'use strict';
document.getElementById('burger').addEventListener('click', () =>
  document.getElementById('menu').classList.toggle('open'));
document.getElementById('menu').addEventListener('click', e => {
  if (e.target.tagName === 'A') document.getElementById('menu').classList.remove('open');
});

let CSRF = '';
let editing = null;       // original name when editing, null when adding
let editingZone = null;   // motion_zone of the camera being edited
let zoneCam = null;       // camera open in the zone editor
let zoneRect = null;      // [x, y, w, h] normalized 0..1, null = no zone
let zoneDrag = null;      // [x, y] drag origin while drawing

async function api(path, method = 'GET', data) {
  const res = await fetch('api/' + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
    body: data ? JSON.stringify(data) : undefined,
  });
  if (res.status === 401) { location = 'login.html'; throw new Error('auth'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

const LABEL = { online: 'online (streaming)', standby: 'standby', disabled: 'disabled' };
const fail = e => { document.getElementById('err').textContent = e.message; console.error('admin:', e.message); };

async function refresh() {
  const cams = await api('cameras.php?all=1');
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  for (const c of cams) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="dot ${c.status}" title="${LABEL[c.status] || c.status}"></span></td>
      <td></td>
      <td class="src"></td>
      <td>${c.transcode_audio ? '<span class="badge">transcode</span>' : ''}${c.motion ? ' <span class="badge">motion</span>' : ''}</td>
      <td><input type="checkbox" ${c.enabled ? 'checked' : ''} data-act="toggle"></td>
      <td>
        <button data-act="zone" class="${c.motion_zone ? 'zone-on' : 'zone-off'}">ZONE</button>
        <button class="ghost" data-act="edit">Edit</button>
        <button class="danger" data-act="del">Delete</button>
      </td>`;
    tr.cells[1].textContent = c.name;
    tr.cells[2].textContent = c.source;
    tr.cells[2].title = c.source;
    tr.querySelector('[data-act=toggle]').addEventListener('change', async e => {
      await api('cameras.php', 'PUT', { original: c.name, name: c.name, source: c.source,
        transcode_audio: c.transcode_audio, motion: c.motion,
        motion_threshold: c.motion_threshold, motion_source: c.motion_source,
        motion_zone: c.motion_zone,
        enabled: e.target.checked });
      refresh();
    });
    tr.querySelector('[data-act=zone]').addEventListener('click', () => openZone(c));
    tr.querySelector('[data-act=edit]').addEventListener('click', () => openModal(c));
    tr.querySelector('[data-act=del]').addEventListener('click', async () => {
      if (!confirm(`Delete camera "${c.name}"?`)) return;
      await api('cameras.php', 'DELETE', { name: c.name });
      refresh();
    });
    rows.appendChild(tr);
  }
}

function openModal(cam) {
  editing = cam ? cam.name : null;
  editingZone = cam ? (cam.motion_zone || null) : null;
  document.getElementById('modal-title').textContent = cam ? `Edit ${cam.name}` : 'Add camera';
  document.getElementById('f-name').value = cam ? cam.name : '';
  document.getElementById('f-source').value = cam ? cam.source : '';
  document.getElementById('f-transcode').checked = cam ? cam.transcode_audio : false;
  document.getElementById('f-motion').checked = cam ? !!cam.motion : false;
  // sensitivity slider 0-9  <->  threshold 0.10..0.01 (5 = default 0.05)
  const thr = cam && cam.motion_threshold != null ? cam.motion_threshold : 0.05;
  document.getElementById('f-sens').value = Math.round((0.10 - thr) / 0.01);
  document.getElementById('f-sens-val').textContent = document.getElementById('f-sens').value;
  document.getElementById('motion-sens-row').style.display = cam && cam.motion ? 'block' : 'none';
  document.getElementById('f-enabled').checked = cam ? cam.enabled : true;
  document.getElementById('test-result').textContent = '';
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

document.getElementById('add').addEventListener('click', () => openModal(null));
document.getElementById('cancel').addEventListener('click', closeModal);
document.getElementById('f-motion').addEventListener('change', e => {
  document.getElementById('motion-sens-row').style.display = e.target.checked ? 'block' : 'none';
});
document.getElementById('f-sens').addEventListener('input', e => {
  document.getElementById('f-sens-val').textContent = e.target.value;
});

document.getElementById('test').addEventListener('click', async () => {
  const out = document.getElementById('test-result');
  out.className = '';
  out.textContent = 'testing…';
  try {
    const r = await api('camera-test.php', 'POST', {
      source: document.getElementById('f-source').value,
    });
    if (r.ok) {
      out.className = 'ok';
      out.textContent = `OK — video: ${r.video}` +
        (r.audio ? `, audio: ${r.audio}` : '') + (r.hint ? ` (${r.hint})` : '');
    } else {
      out.className = 'fail';
      out.textContent = r.error;
    }
  } catch (e) {
    out.className = 'fail';
    out.textContent = e.message;
  }
});

document.getElementById('save').addEventListener('click', async () => {
  const err = document.getElementById('err');
  err.textContent = '';
  const cam = {
    name: document.getElementById('f-name').value.trim(),
    source: document.getElementById('f-source').value.trim(),
    transcode_audio: document.getElementById('f-transcode').checked,
    motion: document.getElementById('f-motion').checked,
    motion_threshold: 0.10 - 0.01 * parseInt(document.getElementById('f-sens').value, 10),
    motion_zone: editing ? editingZone : null,
    enabled: document.getElementById('f-enabled').checked,
  };
  try {
    if (editing) await api('cameras.php', 'PUT', { original: editing, ...cam });
    else await api('cameras.php', 'POST', cam);
    closeModal();
    refresh();
  } catch (e) {
    document.getElementById('test-result').className = 'fail';
    document.getElementById('test-result').textContent = e.message;
  }
});

// ---------- motion zone editor ----------

function drawZoneRect() {
  const r = document.getElementById('zone-rect');
  if (!zoneRect) { r.style.display = 'none'; return; }
  const [x, y, w, h] = zoneRect;
  r.style.display = 'block';
  r.style.left = (x * 100) + '%';
  r.style.top = (y * 100) + '%';
  r.style.width = (w * 100) + '%';
  r.style.height = (h * 100) + '%';
}

function closeZone() {
  document.getElementById('zone-bg').classList.remove('open');
  zoneDrag = null;
  const img = document.getElementById('zone-img');
  img.onload = img.onerror = null;
  img.removeAttribute('src');  // stop a slow fetch and drop the stale frame
}

function openZone(cam) {
  zoneCam = cam;
  zoneRect = cam.motion_zone ? [...cam.motion_zone] : null;
  zoneDrag = null;
  document.getElementById('zone-title').textContent = `Motion zone — ${cam.name}`;
  const view = document.getElementById('zone-view');
  const hint = document.getElementById('zone-hint');
  const img = document.getElementById('zone-img');
  // block selection until the frame is fully loaded: before that the view
  // box has no real size and drag math would clamp to random corners
  view.classList.add('pending');
  hint.className = '';
  hint.textContent = 'Loading frame…';
  img.onload = () => {
    view.classList.remove('pending');
    hint.textContent = 'Drag a rectangle on the frame — only motion inside it is recorded.';
  };
  img.onerror = () => {
    hint.className = 'err';
    hint.textContent = 'Could not grab a frame from this camera (offline?) — try again.';
  };
  img.src = 'api/snapshot.php?name=' + encodeURIComponent(cam.name) + '&t=' + Date.now();
  drawZoneRect();
  document.getElementById('zone-bg').classList.add('open');
}

function zonePos(ev) {
  const r = document.getElementById('zone-view').getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return null;  // frame not laid out yet
  return [
    Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
    Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height)),
  ];
}

document.getElementById('zone-view').addEventListener('mousedown', ev => {
  ev.preventDefault();
  if (document.getElementById('zone-view').classList.contains('pending')) return;
  zoneDrag = zonePos(ev);
});
window.addEventListener('mousemove', ev => {
  if (!zoneDrag) return;
  // a stuck drag (missed mouseup, modal closed mid-drag) must never draw
  if (!document.getElementById('zone-bg').classList.contains('open')) {
    zoneDrag = null;
    return;
  }
  const p = zonePos(ev);
  if (!p) return;
  const [x0, y0] = zoneDrag, [x1, y1] = p;
  zoneRect = [Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)];
  drawZoneRect();
});
window.addEventListener('mouseup', () => {
  if (zoneDrag && zoneRect && (zoneRect[2] < 0.01 || zoneRect[3] < 0.01)) {
    zoneRect = null;  // misclick, not a zone
    drawZoneRect();
  }
  zoneDrag = null;
});
// pointer left the browser window mid-drag -> end the drag
document.documentElement.addEventListener('mouseleave', () => { zoneDrag = null; });

document.getElementById('zone-clear').addEventListener('click', () => {
  zoneRect = null;
  drawZoneRect();
});
document.getElementById('zone-cancel').addEventListener('click', closeZone);
document.getElementById('zone-accept').addEventListener('click', async () => {
  try {
    await api('cameras.php', 'PUT', {
      original: zoneCam.name, name: zoneCam.name, source: zoneCam.source,
      transcode_audio: zoneCam.transcode_audio, motion: zoneCam.motion,
      motion_threshold: zoneCam.motion_threshold, motion_source: zoneCam.motion_source,
      enabled: zoneCam.enabled, motion_zone: zoneRect,
    });
    closeZone();
    refresh();
  } catch (e) { fail(e); }
});

document.getElementById('logout').addEventListener('click', async e => {
  e.preventDefault();
  await api('logout.php', 'POST');
  location = 'login.html';
});

(async () => {
  const me = await api('me.php');
  if (me.setup_needed) { location = 'setup.html'; return; }
  if (me.user.role !== 'admin') { location = 'index.html'; return; }
  CSRF = me.csrf;
  document.getElementById('who').textContent = me.user.username;
  refresh().catch(fail);
  setInterval(() => refresh().catch(fail), 15000);
})();
</script>
</body>
</html>
